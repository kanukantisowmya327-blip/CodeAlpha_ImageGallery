<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>Gallery</h1>
    <p class="count" id="count" aria-live="polite"></p>
  </header>

  <nav class="filters" id="filters" aria-label="Filter images by category"></nav>

  <main>
    <section class="grid" id="grid" aria-label="Image gallery"></section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close viewer">&times;</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">&#10094;</button>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">&#10095;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="" />
      <figcaption>
        <span id="lbTitle"></span>
        <span id="lbCounter"></span>
      </figcaption>
    </figure>
  </div>

  <script src="script.js"></script>
</body>
</html>
